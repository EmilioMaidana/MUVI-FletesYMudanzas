# Production compose for the VPS hosting api.fletea.com.ar
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Services:
#   - postgres: persistent DB
#   - backend:  Spring Boot, listens on :8080 inside the network (no host port)
#   - caddy:    reverse proxy, terminates TLS for api.fletea.com.ar via Let's Encrypt
#
# The frontend is NOT in this compose — it runs on Vercel.

services:
  postgres:
    image: postgres:16-alpine
    container_name: fletea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleteadb
      POSTGRES_USER: fletea
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fletea -d fleteadb"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port published — only reachable inside the compose network
    networks:
      - fletea-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fletea-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleteadb
      SPRING_DATASOURCE_USERNAME: fletea
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-https://api.fletea.com.ar/api/payments/webhook}
      FLETEA_FRONTEND_URL: ${FLETEA_FRONTEND_URL:-https://www.fletea.com.ar}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://www.fletea.com.ar,https://fletea.com.ar,https://*.vercel.app}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    # No host port — Caddy is the only public ingress
    networks:
      - fletea-net

  caddy:
    image: caddy:2-alpine
    container_name: fletea-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - fletea-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  fletea-net:
    driver: bridge
