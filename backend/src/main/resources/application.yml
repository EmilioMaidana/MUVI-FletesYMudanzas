  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:vaflete2024}
  jwt-secret: ${JWT_SECRET:m8K2pL9xQwN4vR7tY1zA3cF6gH0jE5bU}

google:
